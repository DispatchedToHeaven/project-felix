[package]
name = "projectfelix"
version = "0.13.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The game's own versions (the native build takes no other graph).
png = "=0.18.1"
miniz_oxide = "=0.8.9"
crc32fast = "=1.5.2"
